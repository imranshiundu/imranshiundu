name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: imranshiundu
          template: classic
          base: ""
          config_timezone: Africa/Nairobi
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_licenses: yes
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers
          plugin_repositories: yes
          plugin_repositories_limit: 8
          plugin_repositories_affiliation: owner, collaborator
          plugin_stargazers: yes
          plugin_stars_limit: 4
          plugin_traffic: yes
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          plugin_followup: yes
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_notable: yes
          plugin_notable_from: organization, repository
          plugin_notable_types: commit, issue, pull_request, release
          plugin_organizations: yes
          plugin_organizations_limit: 6
          plugin_organizations_user: imranshiundu
          plugin_pagespeed: yes
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_url: https://imranshiundu.netlify.app
          plugin_rss: yes
          plugin_rss_limit: 3
          plugin_rss_source: https://dev.to/feed/imranshiundu
          plugin_rss_title: yes
          plugin_starlists: yes
          plugin_topics: yes
          plugin_topics_mode: starred
          plugin_topics_limit: 12
          plugin_topics_sort: stars