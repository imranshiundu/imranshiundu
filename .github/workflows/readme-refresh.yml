name: Refresh README Blocks

on:
  schedule:
    - cron: "0 6 * * *"   # Daily at 06:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "data/projects.json"
      - "docs/CODING_SYSTEM.md"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh README blocks
        run: npm run readme:refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: imranshiundu
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/GITHUB_ACTIVITY.md
          git diff --staged --quiet || git commit -m "chore: auto-refresh README blocks [skip ci]"
          git push
