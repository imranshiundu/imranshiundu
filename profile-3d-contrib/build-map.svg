<svg width="720" height="214" viewBox="0 0 720 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What I build: AI systems, trading infrastructure, web products, backend tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#151b23"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="214" rx="18" fill="url(#bg)"/>
  <text x="28" y="38" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">What I build</text>
  <text x="28" y="61" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">systems, tools, infrastructure, and products</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="28" y="82" width="316" height="48" rx="14" fill="#111827" stroke="#8b5cf6"/>
    <circle cx="52" cy="106" r="7" fill="#8b5cf6" filter="url(#glow)"><animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="70" y="102" fill="#f8fafc" font-size="14" font-weight="800">AI systems</text>
    <text x="70" y="119" fill="#cbd5e1" font-size="12">assistants · agents · research flows · automation</text>

    <rect x="376" y="82" width="316" height="48" rx="14" fill="#111827" stroke="#22c55e"/>
    <circle cx="400" cy="106" r="7" fill="#22c55e" filter="url(#glow)"><animate attributeName="r" values="5;8;5" dur="2.8s" repeatCount="indefinite"/></circle>
    <text x="418" y="102" fill="#f8fafc" font-size="14" font-weight="800">Trading infrastructure</text>
    <text x="418" y="119" fill="#cbd5e1" font-size="12">backtesting · risk controls · execution · reporting</text>

    <rect x="28" y="145" width="316" height="48" rx="14" fill="#111827" stroke="#38bdf8"/>
    <circle cx="52" cy="169" r="7" fill="#38bdf8" filter="url(#glow)"><animate attributeName="r" values="5;8;5" dur="3.1s" repeatCount="indefinite"/></circle>
    <text x="70" y="165" fill="#f8fafc" font-size="14" font-weight="800">Web products</text>
    <text x="70" y="182" fill="#cbd5e1" font-size="12">dashboards · admin flows · booking systems · UX</text>

    <rect x="376" y="145" width="316" height="48" rx="14" fill="#111827" stroke="#f59e0b"/>
    <circle cx="400" cy="169" r="7" fill="#f59e0b" filter="url(#glow)"><animate attributeName="r" values="5;8;5" dur="3.4s" repeatCount="indefinite"/></circle>
    <text x="418" y="165" fill="#f8fafc" font-size="14" font-weight="800">Backend tools</text>
    <text x="418" y="182" fill="#cbd5e1" font-size="12">APIs · scripts · internal tools · deployment workflows</text>
  </g>
</svg>
