<svg width="720" height="148" viewBox="0 0 720 148" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hi, I'm Imran. I build useful software systems.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#151b23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="34%" stop-color="#22c55e"/>
      <stop offset="68%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="148" rx="18" fill="url(#bg)"/>
  <circle cx="650" cy="22" r="70" fill="#8b5cf6" opacity="0.10">
    <animate attributeName="r" values="58;76;58" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="128" r="54" fill="#22c55e" opacity="0.08">
    <animate attributeName="r" values="45;62;45" dur="5.8s" repeatCount="indefinite"/>
  </circle>
  <rect x="28" y="30" width="664" height="5" rx="3" fill="url(#accent)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <text x="28" y="70" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Hi, I'm Imran. I build useful software systems.</text>
  <text x="28" y="99" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Interested in intelligence, infrastructure, markets, interfaces, and automation.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">
    <rect x="28" y="113" width="90" height="22" rx="11" fill="#1f2937" stroke="#8b5cf6"/>
    <text x="48" y="128" fill="#f8fafc">systems</text>
    <rect x="130" y="113" width="108" height="22" rx="11" fill="#1f2937" stroke="#22c55e"/>
    <text x="150" y="128" fill="#f8fafc">automation</text>
    <rect x="250" y="113" width="102" height="22" rx="11" fill="#1f2937" stroke="#38bdf8"/>
    <text x="270" y="128" fill="#f8fafc">interfaces</text>
    <rect x="364" y="113" width="88" height="22" rx="11" fill="#1f2937" stroke="#f59e0b"/>
    <text x="384" y="128" fill="#f8fafc">markets</text>
  </g>
</svg>
