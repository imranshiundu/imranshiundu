<svg width="720" height="148" viewBox="0 0 720 148" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hi, I'm Imran. I build web apps and software systems.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="58%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#14101f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="42%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .eyebrow{font:800 11px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;letter-spacing:.18em}
      .title{font:800 29px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:-.65px}
      .sub{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
    </style>
  </defs>

  <rect width="720" height="148" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="718" height="146" rx="23" fill="none" stroke="#334155" stroke-opacity=".45"/>

  <circle cx="645" cy="28" r="72" fill="#8b5cf6" opacity=".12"/>
  <circle cx="72" cy="140" r="54" fill="#38bdf8" opacity=".05"/>
  <path d="M560 36c44 12 78 42 101 84" fill="none" stroke="#a855f7" stroke-width="24" stroke-linecap="round" opacity=".11"/>

  <rect x="36" y="34" width="648" height="4" rx="2" fill="url(#accent)" filter="url(#softGlow)">
    <animate attributeName="opacity" values=".72;1;.72" dur="3.8s" repeatCount="indefinite"/>
  </rect>

  <text class="eyebrow" x="36" y="70">HI, I'M IMRAN</text>
  <text class="title" x="36" y="108">I build web apps and software systems.</text>
  <text class="sub" x="36" y="132">Clean interfaces. Strong backends. Real execution.</text>
</svg>
