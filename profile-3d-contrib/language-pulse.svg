<svg width="720" height="150" viewBox="0 0 720 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Language activity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="720" height="150" rx="18" fill="url(#bg)"/>
  <text x="30" y="38" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Language activity</text>
  <text x="30" y="61" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Auto-generated from public repository language data</text>
  <rect x="30" y="84" width="660" height="18" rx="9" fill="#30363d"/>
  <rect x="30" y="84" width="520" height="18" rx="9" fill="url(#bar)">
    <animate attributeName="opacity" values="0.72;1;0.72" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#e2e8f0">
    <text x="30" y="128">JavaScript</text>
    <text x="145" y="128">HTML</text>
    <text x="225" y="128">Python</text>
    <text x="315" y="128">TypeScript</text>
    <text x="430" y="128">Java</text>
  </g>
</svg>
