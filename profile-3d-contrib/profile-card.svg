<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hi, I'm Imran. I build useful software systems.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="58%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#15111f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="28%" stop-color="#22c55e"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:800 34px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:-0.8px}
      .sub{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .pill{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .link{font:800 14px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .tiny{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;letter-spacing:.16em}
    </style>
  </defs>

  <rect width="900" height="280" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="278" rx="27" fill="none" stroke="#334155" stroke-opacity="0.55"/>

  <circle cx="805" cy="43" r="98" fill="#8b5cf6" opacity="0.13">
    <animate attributeName="r" values="82;104;82" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="242" r="82" fill="#22c55e" opacity="0.08">
    <animate attributeName="r" values="68;90;68" dur="7s" repeatCount="indefinite"/>
  </circle>
  <path d="M692 68c55 15 101 57 128 111" fill="none" stroke="url(#soft)" stroke-width="32" stroke-linecap="round" opacity="0.55"/>

  <g transform="translate(52 46)">
    <rect width="796" height="7" rx="4" fill="url(#line)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.62;1;0.62" dur="3.4s" repeatCount="indefinite"/>
    </rect>

    <text class="tiny" x="0" y="44">IMRANSHIUNDU / README</text>
    <text class="title" x="0" y="88">Hi, I'm Imran. I build useful software systems.</text>
    <text class="sub" x="0" y="120">Intelligence, infrastructure, markets, interfaces, and automation.</text>

    <g transform="translate(0 144)">
      <rect width="102" height="30" rx="15" fill="#111827" stroke="#a855f7"/>
      <text class="pill" x="29" y="20">systems</text>
      <rect x="116" width="126" height="30" rx="15" fill="#111827" stroke="#22c55e"/>
      <text class="pill" x="143" y="20">automation</text>
      <rect x="256" width="118" height="30" rx="15" fill="#111827" stroke="#38bdf8"/>
      <text class="pill" x="282" y="20">interfaces</text>
      <rect x="388" width="102" height="30" rx="15" fill="#111827" stroke="#f59e0b"/>
      <text class="pill" x="416" y="20">markets</text>
    </g>

    <g transform="translate(0 200)">
      <rect width="175" height="38" rx="19" fill="#0b1020" stroke="#a855f7"/>
      <text class="link" x="58" y="25">Website</text>
      <rect x="192" width="175" height="38" rx="19" fill="#0b1020" stroke="#22c55e"/>
      <text class="link" x="250" y="25">LinkedIn</text>
      <rect x="384" width="175" height="38" rx="19" fill="#0b1020" stroke="#38bdf8"/>
      <text class="link" x="446" y="25">GitHub</text>
      <rect x="576" width="175" height="38" rx="19" fill="#0b1020" stroke="#f59e0b"/>
      <text class="link" x="640" y="25">Email</text>
    </g>
  </g>
</svg>
