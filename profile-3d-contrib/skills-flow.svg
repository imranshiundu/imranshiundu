<svg width="720" height="150" viewBox="0 0 720 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated skills flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#151b23"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="35%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="150" rx="18" fill="url(#bg)"/>
  <text x="28" y="38" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Core skills</text>
  <text x="28" y="61" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">frontend · backend · systems · AI engineering</text>

  <path d="M34 92 C150 62, 210 122, 330 92 S535 62, 686 92" stroke="#30363d" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M34 92 C150 62, 210 122, 330 92 S535 62, 686 92" stroke="url(#glow)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="120 560" filter="url(#softGlow)">
    <animate attributeName="stroke-dashoffset" values="0;-680" dur="4.5s" repeatCount="indefinite"/>
  </path>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">
    <g>
      <rect x="46" y="105" width="126" height="26" rx="13" fill="#1f2937" stroke="#8b5cf6"/>
      <text x="64" y="122" fill="#f8fafc">Next.js · React</text>
    </g>
    <g>
      <rect x="190" y="105" width="151" height="26" rx="13" fill="#1f2937" stroke="#22c55e"/>
      <text x="208" y="122" fill="#f8fafc">Java · Spring Boot</text>
    </g>
    <g>
      <rect x="359" y="105" width="134" height="26" rx="13" fill="#1f2937" stroke="#38bdf8"/>
      <text x="377" y="122" fill="#f8fafc">Python · Docker</text>
    </g>
    <g>
      <rect x="511" y="105" width="156" height="26" rx="13" fill="#1f2937" stroke="#f59e0b"/>
      <text x="529" y="122" fill="#f8fafc">LLM workflows</text>
    </g>
  </g>
</svg>
