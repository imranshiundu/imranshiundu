<svg width="720" height="232" viewBox="0 0 720 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Professional skills overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#15111f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="42%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      .title{font:800 22px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:-.3px}
      .lead{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .cardTitle{font:800 13px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .cardText{font:500 11px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .stack{font:700 10.5px Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe}
    </style>
  </defs>

  <g transform="translate(0 2)">
    <rect width="720" height="230" rx="22" fill="url(#bg)"/>
    <rect x="1" y="1" width="718" height="228" rx="21" fill="none" stroke="#334155" stroke-opacity=".45"/>
    <circle cx="646" cy="26" r="76" fill="#8b5cf6" opacity=".10"/>
    <circle cx="70" cy="210" r="64" fill="#38bdf8" opacity=".055"/>

    <rect x="30" y="30" width="660" height="3" rx="2" fill="url(#line)" opacity=".9">
      <animate attributeName="opacity" values=".62;1;.62" dur="4s" repeatCount="indefinite"/>
    </rect>

    <text class="title" x="30" y="66">Engineering strengths</text>
    <text class="lead" x="30" y="90">Full-stack execution for products that need speed, reliability, and real-world business value.</text>

    <g transform="translate(30 116)">
      <rect width="205" height="78" rx="16" fill="#0f172a" stroke="#a855f7" stroke-opacity=".55"/>
      <text class="cardTitle" x="18" y="25">Product engineering</text>
      <text class="cardText" x="18" y="45">Production-ready web apps, MVPs,</text>
      <text class="cardText" x="18" y="61">dashboards, portals, and interfaces.</text>
      <text class="stack" x="18" y="92" display="none">Next.js TypeScript React Tailwind</text>
    </g>

    <g transform="translate(258 116)">
      <rect width="205" height="78" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".55"/>
      <text class="cardTitle" x="18" y="25">Systems architecture</text>
      <text class="cardText" x="18" y="45">APIs, databases, backends, audits,</text>
      <text class="cardText" x="18" y="61">refactors, scaling, and performance.</text>
    </g>

    <g transform="translate(486 116)">
      <rect width="204" height="78" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-opacity=".55"/>
      <text class="cardTitle" x="18" y="25">Applied intelligence</text>
      <text class="cardText" x="18" y="45">AI workflows, automation, research,</text>
      <text class="cardText" x="18" y="61">legal, finance, and market systems.</text>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">
      <rect x="30" y="205" width="90" height="1.5" rx="1" fill="#a855f7"/>
      <text x="130" y="209" fill="#cbd5e1">Next.js</text>
      <text x="190" y="209" fill="#cbd5e1">TypeScript</text>
      <text x="278" y="209" fill="#cbd5e1">Node.js</text>
      <text x="344" y="209" fill="#cbd5e1">PostgreSQL</text>
      <text x="438" y="209" fill="#cbd5e1">Java / Spring</text>
      <text x="545" y="209" fill="#cbd5e1">Python</text>
      <text x="605" y="209" fill="#cbd5e1">Tailwind</text>
    </g>
  </g>
</svg>
